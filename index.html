---
layout: default
title: HOME
---
    <div class="hero-container">
        <div class="hero-content">
            <h2 class="greeting">Hi there, my name is</h2>
            <h1 class="name">AL FAIZ AKBAR <span class="last_name">THAIB</span></h1> 
            <p class="tagline"><span class="typed-text"></span><span class="cursor">&nbsp;</span></p>

<script>
    const typedTextSpan = document.querySelector(".typed-text");
    const cursorSpan = document.querySelector(".cursor");
    const phrases = ["Saya Adalah Seorang Mahasiswa Politeknik Jurusan Teknologi Informasi dan Komputer", 
                    "Saya Alumni SMKN 1 Lhokseumawe Jurusan Rekayasa Perangkat Lunak",
                    "Cita Cita saya Ingin Menjadi Programmer",
                    "Hobi saya Ngoding"];

    let phraseIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let isEnd = false;

    function type() {
        isEnd = false;
        const currentPhrase = phrases[phraseIndex];

        if (isDeleting) {
            typedTextSpan.textContent = currentPhrase.substring(0, charIndex - 1);
            charIndex--;
        } else {
            typedTextSpan.textContent = currentPhrase.substring(0, charIndex + 1);
            charIndex++;
        }

        // Add blinking cursor
        cursorSpan.classList.toggle('typing');

        let typeSpeed = isDeleting ? 40 : 60;

        if (!isDeleting && charIndex === currentPhrase.length) {
            isEnd = true;
            isDeleting = true;
            typeSpeed = 4000;
        } else if (isDeleting && charIndex === 0) {
            isDeleting = false;
            phraseIndex = (phraseIndex + 1) % phrases.length;
            typeSpeed = 2000;
        }

        setTimeout(type, typeSpeed);
    }

    window.onload = type;
</script>

<style>
    .cursor {
        display: inline-block;
        width: 3px;
        background-color: #4aa3df;
        margin-left: 2px;
        animation: blink 1s infinite;
    }

    .cursor.typing {
        animation: none;
    }

    @keyframes blink {
        0% { background-color: #4aa3df; }
        49% { background-color: #4aa3df; }
        50% { background-color: transparent; }
        99% { background-color: transparent; }
        100% { background-color: #4aa3df; }
    }
</style>
        </div>
    </div>
</body>
<script>
    window.addEventListener('scroll', function() {
        const nav = document.querySelector('nav');
        if (window.scrollY > 50) {
            nav.classList.add('scrolled');
        } else {
            nav.classList.remove('scrolled');
        }
    });
</script>
</html>
